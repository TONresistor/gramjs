name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 24

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.10.1

      - run: npm ci
      - run: npm run check:generated
      - run: npm run generate:tl
      - run: npm run build:git
      - name: Verify generated files are committed
        run: git diff --exit-code
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Enforce full audit exceptions
        run: npm run audit:exceptions
      - run: npm run check:package
      - run: npm run check:git-package

      - name: Build browser bundle
        if: matrix.node == 24
        run: npm run build:browser

  release:
    name: GitHub release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm install --global npm@11.10.1
      - run: npm ci
      - name: Verify release tag matches package version
        run: npm run check:release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run generate:tl
      - run: npm run build:git
      - run: npm run build:browser

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          files: browser/telegram.js
